version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: symptotrack-app
    ports:
      - "8000:8000"
    volumes:
      # Mount the app directory for development (hot reload)
      - .:/app
      # Persist database
      - ./db.sqlite3:/app/db.sqlite3
      # Persist model files
      - ./model:/app/model
      # Persist dataset
      - ./Dataset:/app/Dataset
    environment:
      - PYTHONUNBUFFERED=1
      - DEBUG=1
    restart: unless-stopped
    command: python manage.py runserver 0.0.0.0:8000 --noreload
